# Local development database only (PostgreSQL 17). Not a deployment artefact.
# Usage: see README "Local database".
services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    ports:
      - '127.0.0.1:5432:5432'
    volumes:
      - lekvero-pg:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres']
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  lekvero-pg:
